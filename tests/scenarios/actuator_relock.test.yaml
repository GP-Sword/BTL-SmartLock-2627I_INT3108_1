# OWNER: Task 3.
# Kịch bản kiểm thử Actuator (preset test: RELOCK_MS = 5000 ms, cửa mở dừng đếm).
#
# Kịch bản 1: u -> LED xanh sáng, 5.5 s sau RELOCKED (cửa đóng)
# Kịch bản 2: u -> o (cửa mở) -> chờ 6 s -> LED vẫn sáng -> c (cửa đóng) -> RELOCKED
# Kịch bản 3: e (khẩn cấp) -> LED xanh sáng, 5.5 s sau RELOCKED
name: 'Task 3 - tu khoa sau 5 s'
version: 1
author: 'task3'

steps:
  - wait-serial: 'SMARTLOCK READY 72MHz'

  # --- Kịch bản 1: UNLOCK → tự khóa sau 5 s (cửa đóng) ---
  - write-serial: 'u'
  - wait-serial: 'ACT:UNLOCK'
  - expect-pin:
      part-id: led_green
      pin: A
      value: 1
  - delay: 5500ms
  - wait-serial: 'RELOCKED'
  - expect-pin:
      part-id: led_green
      pin: A
      value: 0

  # --- Kịch bản 2: UNLOCK, cửa mở → không tự khóa; đóng cửa → RELOCKED ---
  - write-serial: 'u'
  - wait-serial: 'ACT:UNLOCK'
  - expect-pin:
      part-id: led_green
      pin: A
      value: 1
  # Mở cửa (slide-switch đẩy lên = LOW → HIGH → g_doorOpen = 1)
  - set-control:
      part-id: door
      control: position
      value: '1'
  - delay: 6000ms
  # LED phải vẫn sáng (chưa RELOCKED vì cửa mở)
  - expect-pin:
      part-id: led_green
      pin: A
      value: 1
  # Đóng cửa lại → bắt đầu đếm 5 s
  - set-control:
      part-id: door
      control: position
      value: '0'
  - delay: 5500ms
  - wait-serial: 'RELOCKED'
  - expect-pin:
      part-id: led_green
      pin: A
      value: 0

  # --- Kịch bản 3: Nút khẩn cấp → mở khóa ngay, 5 s sau tự khóa ---
  - set-control:
      part-id: btn_emergency
      control: pressed
      value: '1'
  - delay: 100ms
  - set-control:
      part-id: btn_emergency
      control: pressed
      value: '0'
  - wait-serial: 'EMERGENCY'
  - expect-pin:
      part-id: led_green
      pin: A
      value: 1
  - delay: 5500ms
  - wait-serial: 'RELOCKED'
  - expect-pin:
      part-id: led_green
      pin: A
      value: 0
